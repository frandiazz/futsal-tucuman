<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="phBg" x1="0" y1="0" x2="400" y2="300">
      <stop offset="0%" stop-color="#0B1D13"/>
      <stop offset="100%" stop-color="#0F2A1C"/>
    </linearGradient>
    <linearGradient id="phAccent" x1="0" y1="0" x2="400" y2="0">
      <stop offset="0%" stop-color="#19C37D" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFD60A" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#phBg)"/>
  
  <!-- Pitch silhouette -->
  <g stroke="url(#phAccent)" stroke-width="2" fill="none">
    <rect x="20" y="20" width="360" height="260" rx="12"/>
    <line x1="200" y1="20" x2="200" y2="280" stroke-dasharray="8,8"/>
    <circle cx="200" cy="150" r="50"/>
    <rect x="20" y="100" width="40" height="100" rx="4"/>
    <rect x="340" y="100" width="40" height="100" rx="4"/>
    <rect x="20" y="125" width="16" height="50" rx="2"/>
    <rect x="364" y="125" width="16" height="50" rx="2"/>
  </g>
  
  <!-- Futsal ball -->
  <g transform="translate(200, 150)">
    <circle r="18" fill="url(#phAccent)" stroke="#19C37D" stroke-width="1.5"/>
    <path d="M-10,-6 Q0,-10 10,-6 Q15,0 10,6 Q0,10 -10,6 Q-15,0 -10,-6" fill="none" stroke="#0B1D13" stroke-width="1.5" opacity="0.6"/>
    <path d="M-6,0 Q0,-4 6,0 Q8,3 6,6 Q0,10 -6,6 Q-8,3 -6,0" fill="none" stroke="#0B1D13" stroke-width="1.5" opacity="0.4"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="250" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#8AA895" text-anchor="middle" letter-spacing="0.08em">FUTSAL TUCUMÁN</text>
  <text x="200" y="270" font-family="system-ui, sans-serif" font-size="11" fill="#4A6B54" text-anchor="middle" text-transform="uppercase" letter-spacing="0.1em">Asociación Tucumana de Fútbol de Salón</text>
</svg>