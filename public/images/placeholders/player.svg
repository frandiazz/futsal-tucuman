<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="playerBg" x1="0" y1="0" x2="200" y2="200">
      <stop offset="0%" stop-color="#0B1D13"/>
      <stop offset="100%" stop-color="#0F2A1C"/>
    </linearGradient>
    <linearGradient id="playerAccent" x1="0" y1="0" x2="200" y2="0">
      <stop offset="0%" stop-color="#19C37D"/>
      <stop offset="100%" stop-color="#FFD60A"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#playerBg)"/>
  
  <!-- Player silhouette -->
  <g fill="url(#playerAccent)" fill-opacity="0.2">
    <!-- Head -->
    <circle cx="100" cy="55" r="22"/>
    <!-- Body -->
    <path d="M65,100 Q65,75 78,65 Q90,55 100,65 Q110,55 122,65 Q135,75 135,100 V170 H65 Z"/>
    <!-- Arms -->
    <ellipse cx="50" cy="110" rx="10" ry="25"/>
    <ellipse cx="150" cy="110" rx="10" ry="25"/>
    <!-- Legs -->
    <ellipse cx="85" cy="155" rx="12" ry="30"/>
    <ellipse cx="115" cy="155" rx="12" ry="30"/>
  </g>
  
  <!-- Futsal ball at feet -->
  <circle cx="100" cy="170" r="10" fill="url(#playerAccent)" fill-opacity="0.3" stroke="url(#playerAccent)" stroke-width="1"/>
  
  <!-- Number placeholder -->
  <text x="100" y="100" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="url(#playerAccent)" text-anchor="middle" opacity="0.4">#</text>
</svg>